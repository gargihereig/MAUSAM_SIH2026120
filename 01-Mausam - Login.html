<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        window.FontAwesomeConfig = {
          autoReplaceSvg: 'nest'
        };
      </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAUSAM | Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #0f0a1e;
            color: #d8b4fe;
            overflow-x: hidden;
            overflow-y: auto;
            scroll-behavior: smooth;
        }
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: radial-gradient(circle at 50% 50%, #1e1b4b 0%, #0f0a1e 100%);
            z-index: -2;
        }
        .diamond-stars {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: -1;
        }
        .diamond-stars span {
            position: absolute;
            left: var(--x);
            top: var(--y);
            width: var(--s);
            height: var(--s);
            background: rgba(255, 255, 255, var(--a));
            transform: translate(-50%, -50%) rotate(45deg);
            border: 0.4px solid rgba(255, 255, 255, 0.85);
            box-shadow: 0 0 4px rgba(233, 213, 255, 0.5), 0 0 8px rgba(216, 180, 254, 0.2);
            animation: diamondTwinkle 7.5s ease-in-out infinite;
            animation-delay: var(--d);
        }
        .diamond-stars.soft {
            opacity: 0.35;
            filter: blur(0.35px);
        }
        @keyframes diamondTwinkle {
            0% {
                opacity: 0.45;
            }
            50% {
                opacity: 1;
            }
            100% {
                opacity: 0.55;
            }
        }
        .glass-card {
            background: rgba(46, 16, 101, 0.4);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(216, 180, 254, 0.15);
            border-radius: 40px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
        }
        .input-focus:focus {
            outline: none;
            border-color: #d8b4fe;
            box-shadow: 0 0 20px rgba(216, 180, 254, 0.2);
            background: rgba(216, 180, 254, 0.1);
        }
        .btn-lavender {
            background: #d8b4fe;
            color: #2e1065;
            box-shadow: 0 10px 30px rgba(216, 180, 254, 0.3);
        }
        .btn-lavender:hover {
            background: #f5d0fe;
            transform: translateY(-2px);
        }
        .planet-glow {
            position: fixed;
            top: -10%;
            right: -10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(147, 51, 234, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(60px);
            z-index: -1;
        }
        .scroll-down-btn {
            position: fixed;
            bottom: 18px;
            right: 18px;
            z-index: 30;
            background: rgba(46, 16, 101, 0.7);
            border: 1px solid rgba(216, 180, 254, 0.35);
            color: #f5d0fe;
            border-radius: 999px;
            padding: 10px 14px;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            backdrop-filter: blur(10px);
        }
        .scroll-down-btn:hover {
            background: rgba(76, 29, 149, 0.85);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-center items-center p-6">

    <!-- Background Elements -->
    <div class="stars"></div>
    <div class="diamond-stars">
        <span style="--x:8%;--y:12%;--s:2.6px;--a:1;--d:0s"></span>
        <span style="--x:12%;--y:62%;--s:2px;--a:.95;--d:.7s"></span>
        <span style="--x:18%;--y:82%;--s:2.4px;--a:.95;--d:1.4s"></span>
        <span style="--x:26%;--y:34%;--s:2px;--a:.9;--d:2.2s"></span>
        <span style="--x:31%;--y:57%;--s:2.4px;--a:.95;--d:1.1s"></span>
        <span style="--x:38%;--y:88%;--s:1.7px;--a:.95;--d:3s"></span>
        <span style="--x:44%;--y:23%;--s:2.5px;--a:.95;--d:1.8s"></span>
        <span style="--x:52%;--y:46%;--s:2.1px;--a:.9;--d:2.6s"></span>
        <span style="--x:58%;--y:72%;--s:1.7px;--a:.95;--d:3.4s"></span>
        <span style="--x:64%;--y:15%;--s:2.6px;--a:.98;--d:1.9s"></span>
        <span style="--x:71%;--y:66%;--s:2px;--a:.95;--d:.4s"></span>
        <span style="--x:79%;--y:39%;--s:2.5px;--a:.92;--d:2.9s"></span>
        <span style="--x:84%;--y:84%;--s:1.7px;--a:.95;--d:1.3s"></span>
        <span style="--x:91%;--y:27%;--s:2.4px;--a:.95;--d:2.4s"></span>
    </div>
    <div class="diamond-stars soft">
        <span style="--x:15%;--y:22%;--s:3px;--a:.75;--d:.9s"></span>
        <span style="--x:36%;--y:18%;--s:2.8px;--a:.72;--d:2.1s"></span>
        <span style="--x:47%;--y:75%;--s:3px;--a:.7;--d:3.2s"></span>
        <span style="--x:69%;--y:28%;--s:2.8px;--a:.72;--d:1.4s"></span>
        <span style="--x:87%;--y:59%;--s:3px;--a:.74;--d:2.7s"></span>
    </div>
    <div class="planet-glow"></div>
    <div class="fixed inset-0 -z-10 overflow-hidden opacity-50">
        <div class="absolute top-[15%] right-[20%] w-1 h-1 bg-white rounded-full animate-pulse"></div>
        <div class="absolute bottom-[20%] left-[10%] w-1.5 h-1.5 bg-purple-300 rounded-full animate-pulse delay-500"></div>
    </div>

    <!-- Login Container -->
    <div class="w-full max-w-md relative z-10">
        <div class="text-center mb-12">
            <div class="w-20 h-20 bg-gradient-to-br from-purple-400 to-indigo-500 rounded-3xl flex items-center justify-center mx-auto mb-8 shadow-2xl rotate-3 overflow-hidden">
                <img class="w-full h-full object-cover" src="titleimg.jpeg" alt="Mausam logo">
            </div>
            <h1 class="text-4xl font-black mb-3 text-purple-50 tracking-tight">MAUSAM</h1>
            <p class="text-purple-300/60 font-bold uppercase tracking-[0.2em] text-xs italic">begin your cosmic journey</p>
        </div>

        <div class="glass-card p-10 md:p-12">
            <form onsubmit="event.preventDefault(); window.location.href='01-Mausam - Home.html?fromLogin=1';" class="space-y-8">
                <div class="space-y-3">
                    <label class="block text-xs font-black text-purple-400 uppercase tracking-widest ml-1">Ethereal Address</label>
                    <input type="email" placeholder="you@nebula.com" class="w-full bg-indigo-950/30 border border-purple-400/10 rounded-2xl px-6 py-4 text-purple-100 placeholder:text-purple-300/20 input-focus transition-all font-semibold" required>
                </div>
                <div class="space-y-3">
                    <div class="flex justify-between mb-1 px-1">
                        <label class="block text-xs font-black text-purple-400 uppercase tracking-widest">Secret Key</label>
                        <a href="#" class="text-[10px] text-purple-300/40 font-black hover:text-purple-300 transition-colors uppercase tracking-widest">Lost in orbit?</a>
                    </div>
                    <input type="password" placeholder="••••••••" class="w-full bg-indigo-950/30 border border-purple-400/10 rounded-2xl px-6 py-4 text-purple-100 placeholder:text-purple-300/20 input-focus transition-all font-semibold" required>
                </div>

                <button type="submit" class="w-full btn-lavender py-5 rounded-[2rem] font-black text-lg transition-all active:scale-[0.98]">
                    Enter Mausam <i class="fa-solid fa-sparkles ml-2 text-sm"></i>
                </button>

                <div class="relative flex items-center py-6">
                    <div class="flex-grow border-t border-purple-400/10"></div>
                    <span class="flex-shrink mx-4 text-purple-500 text-[10px] font-black uppercase tracking-[0.3em]">Or Align via</span>
                    <div class="flex-grow border-t border-purple-400/10"></div>
                </div>

                <div class="grid grid-cols-2 gap-5">
                    <button type="button" class="flex items-center justify-center space-x-3 bg-purple-900/20 border border-purple-400/10 hover:bg-purple-900/40 py-4 rounded-2xl transition-all shadow-lg backdrop-blur-sm group">
                        <i class="fa-brands fa-google text-purple-300 group-hover:scale-110 transition-transform"></i>
                        <span class="text-xs font-black text-purple-200 uppercase tracking-widest">Google</span>
                    </button>
                    <button type="button" class="flex items-center justify-center space-x-3 bg-purple-900/20 border border-purple-400/10 hover:bg-purple-900/40 py-4 rounded-2xl transition-all shadow-lg backdrop-blur-sm group">
                        <i class="fa-brands fa-apple text-purple-300 group-hover:scale-110 transition-transform"></i>
                        <span class="text-xs font-black text-purple-200 uppercase tracking-widest">Apple</span>
                    </button>
                </div>
            </form>
        </div>

        <p class="text-center mt-10 text-sm text-purple-400/50 font-bold uppercase tracking-widest">
            New traveler? <a href="#" class="text-purple-200 font-black hover:underline ml-1">Create Orbit</a>
        </p>
    </div>

    <div class="mt-auto py-10 opacity-30">
        <img class="w-32 h-auto object-contain grayscale" src="https://storage.googleapis.com/uxpilot-auth.appspot.com/gen_4315d6614b_caaa84d4b9e9754b.png" alt="tiny minimalist illustration of a fox looking at stars, lavender line art style" />
    </div>

    <button type="button" class="scroll-down-btn" onclick="window.scrollBy({ top: window.innerHeight * 0.85, behavior: 'smooth' });">
        Scroll Down <i class="fa-solid fa-arrow-down ml-1"></i>
    </button>

</body>
</html>
